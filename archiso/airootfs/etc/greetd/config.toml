[terminal]
vt = 1

[default_session]
# Autologin straight into niri - same setup as the source machine.
# hycac-niri-session = niri-session with stderr routed to the journal so
# systemd's import-environment deprecation warning never lands on VT1.
command = "/usr/local/bin/hycac-niri-session"
user = "hycac"
