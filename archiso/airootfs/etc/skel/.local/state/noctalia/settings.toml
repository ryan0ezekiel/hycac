config_version = 13

[bar]
order = [ "default" ]

    [bar.default]
    center = [ "workspaces" ]
    end = [ "tray", "group:g3", "group:g1", "session" ]
    margin_ends = 0
    position = "left"
    start = [ "group:g2", "date", "clock" ]

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "brightness", "volume", "battery" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = true
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "cat", "launcher", "control-center" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "notifications", "notes", "clipboard" ]
        opacity = 1.0
        padding = 6.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/notes"]
panel_placement = "attached"
panel_position = "center_left"

[plugins]
enabled = [ "noctalia/notes", "noctalia/bongocat" ]

[shell]
corner_radius_scale = 2.0
font_family = "JetBrains Mono ExtraBold"
niri_overview_type_to_launch_enabled = true
password_style = "random"
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_position = "top_center"
    open_near_click_clipboard = true
    open_near_click_session = true
    polkit_placement = "attached"
    polkit_position = "auto"
    session_position = "center"
    transparency_mode = "soft"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "1"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "2"
    variant = "default"

[theme]
community_palette = "Monochrome"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "cava",
        "emacs",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "helix",
        "hyprland",
        "kcolorscheme",
        "kitty",
        "labwc",
        "mango",
        "niri",
        "qt",
        "scroll",
        "starship",
        "sway",
        "wezterm"
    ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    enabled = false

    [wallpaper.default]
    path = "/usr/share/backgrounds/hycac/hycac-wallpaper.png"

    [wallpaper.last]
    path = "/usr/share/backgrounds/hycac/hycac-wallpaper.png"

    [wallpaper.monitors.eDP-1]
    path = "/usr/share/backgrounds/hycac/hycac-wallpaper.png"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.cat]
capsule = true
color = "error"
input_devices = [ "/dev/input/by-path/platform-i8042-serio-0-event-kbd" ]
type = "noctalia/bongocat:cat"

[widget.clock]
capsule = true

[widget.control-center]
capsule = true
color = "primary"

[widget.launcher]
capsule = true
glyph = "rocket"

[widget.notes]
type = "noctalia/notes:notes"

[widget.session]
capsule = true
color = "error"

[widget.volume]
show_label = false

[widget.workspaces]
capsule = true