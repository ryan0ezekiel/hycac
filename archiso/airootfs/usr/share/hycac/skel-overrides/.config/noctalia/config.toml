# Sir's Noctalia v5 configuration (restored the v4 look by Dobby)

[shell]
polkit_agent = true
avatar_path = "/usr/share/icons/hicolor/256x256/apps/hycac.png"
font_family = "Adwaita Sans"

[wallpaper]
directory = "/usr/share/backgrounds/hycac"
fill_color = "#000000"
fill_mode = "crop"
transition_duration = 1500.0

[wallpaper.automation]
enabled = true
interval_seconds = 300
order = "random"
recursive = true
